  - {id: banh_uot,      label: "Bánh ướt", phrases: ["bánh ướt"]}
  - {id: banh_beo,      label: "Bánh bèo, nậm, lọc", phrases: ["bánh bèo", "bánh nậm", "bánh lọc"]}
  - {id: nem_nuong,     label: "Nem nướng", phrases: ["nem nướng"]}
  - {id: banh_trang,    label: "Bánh tráng nướng", phrases: ["bánh tráng nướng"]}
  - {id: banh_mi,       label: "Bánh mì, xíu mại", phrases: ["bánh mì", "xíu mại"]}
  - {id: lau,           label: "Lẩu", phrases: ["lẩu"]}
  - {id: lau_ga_la_e,   label: "Lẩu gà lá é", phrases: ["lẩu gà lá é"], parent: lau}
  - {id: lau_thai,      label: "Lẩu Thái", phrases: ["lẩu thái"], parent: lau}
  - {id: nuong,         label: "Đồ nướng, BBQ", phrases: ["nướng", "bbq"]}
  - {id: bun_bo,        label: "Bún bò", phrases: ["bún bò"]}
