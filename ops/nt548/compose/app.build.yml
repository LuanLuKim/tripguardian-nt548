# Build the images of app.yml from this checkout instead of pulling them (CI smoke test, local runs):
#   docker compose -f ops/nt548/compose/app.yml -f ops/nt548/compose/app.build.yml up -d --build
services:
  harness:
    build: {context: ../../.., dockerfile: ops/nt548/compose/harness.Dockerfile}
  model-gateway:
    build: {context: ../../.., dockerfile: ops/nt548/compose/harness.Dockerfile}
  web:
    build: {context: ../../.., dockerfile: ops/nt548/compose/web.Dockerfile}
  llm-fake-v1:
    build: {context: ../llm_fake}
  llm-fake-v2:
    build: {context: ../llm_fake}
