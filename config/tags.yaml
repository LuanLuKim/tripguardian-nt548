  - {id: bit_tet,       label: "Bít tết", phrases: ["bít tết", "bò né"]}
  - {id: ca_phe_dac_biet, label: "Cà phê muối, cà phê trứng", phrases: ["cà phê muối", "cà phê trứng"]}
