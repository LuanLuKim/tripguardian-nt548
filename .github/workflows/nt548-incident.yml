name: nt548-incident

# #38 AIOps: CloudWatch alarm in ALARM -> evidence -> summary -> GitHub issue labelled `incident`
# (ops/nt548/aiops/incident.py, docs/nt548/04-aiops.md).
# - demo: a synthetic incident on a GitHub runner, no AWS. The summary goes to the job summary; post=true also opens
#   (or comments on) the `incident` issue.
# - watch: the alarms of the lab, on the self-hosted runner (credentials from LabInstanceProfile).
#   Every 10 minutes while NT548_DEPLOY_ENABLED is "true" (the lab is up): each alarm in ALARM -> an `incident` issue,
#   one report per ALARM episode (incident.py post skips one already on the issue). Off-lab nothing is queued; a run
#   queued while the ops machine is stopped only reads alarms, so running late is harmless.
# LLM (optional): repository variable INCIDENT_LLM_BASE_URL (+ INCIDENT_LLM_MODEL) and secret INCIDENT_LLM_API_KEY.
# Without them the fixed template writes the summary.
# Agent traces (optional, watch): secret LANGSMITH_API_KEY; the harness traces to project nt548-<color> (app.yml).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      source:
        type: choice
        options: [demo, watch]
        default: demo
      case:
        description: demo case
        type: choice
        options: [deploy_500, llm_slow, traffic, llm_errors]
        default: deploy_500
      post:
        description: open / comment on the `incident` issue
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read   # gh run list: the deploys before the alarm

concurrency:
  group: nt548-incident
  cancel-in-progress: false

env:
  INCIDENT_LLM_BASE_URL: ${{ vars.INCIDENT_LLM_BASE_URL }}
  INCIDENT_LLM_MODEL: ${{ vars.INCIDENT_LLM_MODEL }}
  INCIDENT_LLM_API_KEY: ${{ secrets.INCIDENT_LLM_API_KEY }}
  LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  CASE: ${{ inputs.case }}
  POST: ${{ (github.event_name == 'schedule' || inputs.post) && '--post' || '' }}
  NAME_PREFIX: ${{ vars.NT548_NAME_PREFIX || 'nt548' }}

jobs:
  demo:
    if: inputs.source == 'demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scikit-learn
      - run: |
          python ops/nt548/aiops/incident.py demo "$CASE" --repo "$GITHUB_REPOSITORY" $POST --out incident.md
          cat incident.md >> "$GITHUB_STEP_SUMMARY"

  watch:
    if: >-
      inputs.source == 'watch' || (github.event_name == 'schedule' && vars.NT548_DEPLOY_ENABLED == 'true')
    runs-on: [self-hosted, nt548-aws]
    timeout-minutes: 10
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user numpy scikit-learn boto3 langsmith
      - run: |
          python3 ops/nt548/aiops/incident.py watch --prefix "$NAME_PREFIX-" --log-group "/$NAME_PREFIX/app-{color}" \
            --repo "$GITHUB_REPOSITORY" $POST --out incident.md
          [ -s incident.md ] && cat incident.md >> "$GITHUB_STEP_SUMMARY" || echo "no alarm in ALARM" >> "$GITHUB_STEP_SUMMARY"
