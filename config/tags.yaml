# What a dish the user named comes with (bánh căn trứng cút, phở gà, lẩu cua): a place is in a variant when one dish
# statement holds the dish and the variant's phrase together. label follows the dish name.
variant_fold: {"trứng gà": "trứng", "trứng vịt": "trứng", "thịt bò": "bò", "thịt heo": "heo"}  # said another way = the same variant
variants:
  - {id: trung_cut,   label: "trứng cút", phrases: ["trứng cút"]}
  - {id: trung,       label: "trứng", phrases: ["trứng"]}
  - {id: thap_cam,    label: "thập cẩm", phrases: ["thập cẩm"]}
  - {id: xiu_mai,     label: "xíu mại", phrases: ["xíu mại"]}
  - {id: bo,          label: "bò", phrases: ["bò", "thịt bò"]}
  - {id: ga,          label: "gà", phrases: ["gà"]}
  - {id: heo,         label: "heo", phrases: ["heo", "thịt heo", "sườn", "ba chỉ"]}
  - {id: ca,          label: "cá", phrases: ["cá"]}
  - {id: tom,         label: "tôm", phrases: ["tôm"]}
  - {id: cua,         label: "cua", phrases: ["cua"]}
  - {id: hai_san,     label: "hải sản", phrases: ["hải sản", "mực"]}
  - {id: nam,         label: "nấm", phrases: ["nấm"]}
  - {id: chay,        label: "chay", phrases: ["chay"]}
