# Production journey cases (scripts/prod_journey_e2e.py, schema src/bench/prod_cases.py).
# One case = one traveller: the hidden truth, how they talk, which places they pick, how they edit the plan,
# and what "satisfied" means. Dates are in the future of the 2026-11-03 baseline run.
# Group ids follow config/decision.yaml tabs: meal snack cafe nature garden camping sights culture fun night spa market.
cases:

  - id: solo_f_cafe_photo
    title: "Nữ đi một mình, lần đầu, cà phê và chụp ảnh, đi xe khách và Grab"
    axes: [solo_female, first_time, coach_from_hcm, taxi, photo, cafe, two_days]
    persona: "Nữ 26 tuổi, nhẹ nhàng, viết có dấu, câu ngắn, hay dùng 'nha', 'ạ'."
    truth: {days: 2, start: 2026-11-14, people: 1, companions: [solo], mobility: walk, arrive: bus, origin: TP.HCM,
            start_hour: "09:00", pace: slow, budget_vnd: 700000, wants: [cà phê view đẹp, chụp ảnh check-in], notes: "đi taxi Grab, không thuê xe"}
    chat:
      - {text: "Mình là nữ đi Đà Lạt một mình 2 ngày 14-15/11, đi xe khách từ TP.HCM lên, ở đó đi Grab thôi. Mình thích cà phê view đẹp với chụp ảnh check-in nha, sáng 9h mình bắt đầu đi.", kind: opening}
    sim_replies: 2
    pick: {mode: medium, n: 5, groups: [cafe, nature, sights, meal]}
    edits:
      - {op: drop_first, verify: absent}
    expect:
      chat_evidence: {companions: một mình, people: một mình, start_hour: sáng 9h mình bắt đầu}
      stated: [trip, companions, mobility]
      start_hour: "09:00"
      criteria:
        - "Lịch đúng 2 ngày 14-15/11 cho một người"
        - "Có ít nhất 2 quán cà phê hoặc điểm chụp ảnh trong lịch"
        - "Có nói rõ cách tới/về bằng xe khách từ TP.HCM hoặc nói chưa có dữ liệu xe"
        - "Di chuyển trong thành phố không giả định xe máy tự lái"
        - "Ngày 1 bắt đầu khoảng 9h"

  - id: solo_m_trek_cloud_nodiac
    title: "Nam một mình, sinh viên, xe máy từ TP.HCM, săn mây và trekking, gõ không dấu"
    axes: [solo_male, student_budget, motorbike_self_drive, no_diacritics, trek, cloud_hunt, three_days]
    persona: "Nam 21 tuổi sinh viên, gõ không dấu, viết tắt, ngắn gọn, hay dùng 'dc', 'k'."
    truth: {days: 3, start: 2026-11-20, people: 1, companions: [solo], mobility: motorbike, arrive: self, origin: TP.HCM,
            start_hour: "07:00", pace: packed, budget_vnd: 250000, wants: [san may, trekking, dau bep an re], notes: "sinh vien ngan sach rat it"}
    chat:
      - {text: "minh di 1 minh 3 ngay 20-22/11 tu sai gon len bang xe may. sinh vien nen ngan sach rat it, tam 250k 1 ngay. thich san may voi trekking, 7h sang xuat phat", kind: opening}
    sim_replies: 2
    pick: {mode: medium, n: 6, groups: [camping, nature, meal, market]}
    edits:
      - {op: set_day_window, day: 2, start: "05:00", end: "17:00", verify: day_window}
    expect:
      chat_evidence: {companions: 1 minh, people: 1 minh, start_hour: 7h sang xuat phat}
      stated: [trip, companions, mobility, budget]
      start_hour: "07:00"
      criteria:
        - "Lịch 3 ngày 20-22/11 cho một người đi xe máy"
        - "Có săn mây hoặc trekking vào buổi sáng sớm đúng ý"
        - "Quán ăn là chỗ rẻ hợp sinh viên, không phải nhà hàng cao cấp"
        - "Ngày dậy sớm săn mây không kéo dài quá 12 tiếng"
        - "Không có chữ thô hoặc mã trong lịch"

  - id: couple_honeymoon_luxury
