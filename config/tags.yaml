# Tag -> subtag (corpus.tags, docs/PLACE_DECISION.md §Tag và subtag): the words and thresholds that turn a ranked set of
# places into a few named groups (subtags), and the tags the home page ranks by recent TikTok clips.
# A place is in a group only when the corpus holds evidence for it (a VERIFIED / OUTDATED feature, a style tag read from
# photos, a dish on its menu or in review orders, its Maps category). No evidence = in no group, never "not in".

group:
  min_places: 12      # a set smaller than this is a flat list
  min_size: 3         # places a subtag needs
  min_groups: 3       # subtags an axis needs to count as a split
  max_groups: 6
  dish_groups: [restaurant, dessert]  # the dish axis is offered only for a set mostly of these
  dish_min_food: 0.6
  min_cover: 0.5      # share of the set the subtags of an axis must hold together
  max_similar: 0.75   # a group this close (Jaccard) to one already taken is a repeat
  max_overlap: 0.5    # share of the groups' places that may sit in two groups: a split of one-kind-each, not of tags every place has
  min_balance: 0.6    # 0..1: the groups must share the places this evenly (29 + 3 + 3 is not a split)
  max_share: 0.7      # a group holding more than this share of the set does not split it
  cards_per_subtag: 8 # place cards a block carries for each subtag
  axis_bias:          # the better axis wins; a tie goes to the one with the higher bias
    dish: 1.1
    category: 1.0
    experience: 0.95
    style: 0.9

# When the chat shows tags, subtags or a plain list (src/trip/domain/tag_policy.py, docs/TRIP_UNDERSTANDING.md §Tag, subtag
# hay danh sách). The ask's own words decide, counted in "dimensions" it already fixes: a category group, a must feature,
# a dish, a text. A prefer feature is a mood, not a dimension.
policy:
  tags_min_places: 40   # a vague ask (no dimension) shows tags only when the trip's allowed places are at least this many
  flat_dims: 2          # an ask fixing this many dimensions is specific ("quán cà phê săn mây"): the plain list
  repeat_back: 2        # the same tags / subtags block is not shown again when one of the last N blocks was it
  kinds:                # the tags a vague ask is offered: the biggest kinds of the allowed places, a few per axis
    min: 3
    max: 6
    min_size: 4         # places a kind needs
    max_share: 0.6      # a kind held by more of the set than this is no choice
    per_axis: {category: 3, experience: 3}

# Maps category group -> label (standalone subtag name) and noun (what a composed label starts with:
# "Quán cà phê săn mây").
categories:
  cafe:        {label: "Quán cà phê", noun: "Quán cà phê"}
  restaurant:  {label: "Quán ăn & nhà hàng", noun: "Quán ăn"}
  dessert:     {label: "Tiệm bánh, kem & chè", noun: "Tiệm bánh & kem"}
  bar:         {label: "Bar & quán đêm", noun: "Quán bar"}
  market:      {label: "Chợ & phố đi bộ", noun: "Chợ"}
  nature:      {label: "Đồi & thác", noun: "Đồi"}
  garden_farm: {label: "Vườn & nông trại", noun: "Vườn & nông trại"}
  camping:     {label: "Cắm trại & glamping", noun: "Khu cắm trại"}
  attraction:  {label: "Điểm tham quan", noun: "Điểm tham quan"}
  museum:      {label: "Bảo tàng & di tích", noun: "Bảo tàng & di tích"}
  religious:   {label: "Chùa & nhà thờ", noun: "Chùa & nhà thờ"}
  amusement:   {label: "Khu vui chơi", noun: "Khu vui chơi"}
  spa:         {label: "Spa & thư giãn", noun: "Spa"}
  shop:        {label: "Cửa hàng & đặc sản", noun: "Cửa hàng"}
  tour:        {label: "Tour & trải nghiệm", noun: "Tour"}
  golf:        {label: "Sân golf", noun: "Sân golf"}

# Experience / environment features usable as a tag. key = feature id, or "fid=value" for a feature whose value is not
# "present". label: standalone; with: what follows a noun ("Quán cà phê săn mây"); home: offered as a topic on the home
# page (false = too common or too plain to be a topic); split: false = a property of every kind of place, never a
# subtag ("Yên tĩnh" would hold half of any set).
features:
  cloud_hunting:         {label: "Săn mây", with: "săn mây", home: true}
  sunset_view:           {label: "Ngắm hoàng hôn, bình minh", with: "ngắm hoàng hôn", home: true}
  scenic_view:           {label: "View núi đồi, thung lũng", with: "có view đẹp", home: true}
  photo_spot:            {label: "Góc sống ảo", with: "nhiều góc chụp ảnh", home: true}
  nature:                {label: "Thiên nhiên, rừng thông", with: "giữa thiên nhiên", home: true}
  flower_garden:         {label: "Vườn hoa", with: "có vườn hoa", home: true}
  heritage_architecture: {label: "Di tích & kiến trúc", with: "có kiến trúc cổ", home: true}
  cozy_decor:            {label: "Decor ấm cúng", with: "decor ấm cúng", home: false}
  laptop_friendly:       {label: "Ngồi làm việc, học bài", with: "ngồi làm việc được", home: true}
  long_stay_chill:       {label: "Ngồi lâu, chill", with: "ngồi chill được lâu", home: true}
  live_music:            {label: "Nhạc sống", with: "có nhạc sống", home: true}
  adventure_activity:    {label: "Trò mạo hiểm", with: "có trò mạo hiểm", home: true}
  hiking:                {label: "Đi bộ đường dài", with: "đi bộ đường dài", home: true}
  animals:               {label: "Gần gũi thú nuôi", with: "có thú nuôi", home: true}
  hands_on_workshop:     {label: "Workshop tự tay làm", with: "có workshop", home: true}
  pick_your_own:         {label: "Tự hái trái cây", with: "cho tự hái", home: true}
  cultural_show:         {label: "Văn hóa & biểu diễn", with: "có biểu diễn", home: true}
  camping:               {label: "Cắm trại, ngủ lều", with: "cắm trại được", home: true}
  tasting_available:     {label: "Nếm thử tại chỗ", with: "cho nếm thử", home: true}
  costume_rental:        {label: "Thuê trang phục chụp ảnh", with: "cho thuê trang phục", home: true}
  outdoor_seating:       {label: "Chỗ ngồi ngoài trời", with: "có chỗ ngồi ngoài trời", home: false, split: false}
  local_specialty_food:  {label: "Đặc sản địa phương", with: "có đặc sản", home: false, split: false}
  "weather_exposed=sheltered": {label: "Có mái che, trú mưa", with: "có mái che", home: true}
  "setting=indoor":      {label: "Trong nhà", with: "trong nhà", home: false, split: false}
  "crowd=low":           {label: "Vắng, ít khách", with: "vắng khách", home: false, split: false}
  "noise=quiet":         {label: "Yên tĩnh", with: "yên tĩnh", home: false, split: false}

# A label for one category x one fixed feature, when the composed one reads badly ("<category>+<feature>").
overrides:
  "camping+cloud_hunting": "Cắm trại, sáng dậy thấy mây"
  "nature+cloud_hunting": "Đồi & điểm ngắm mây"
  "attraction+cloud_hunting": "Điểm tham quan săn mây"
  "restaurant+cloud_hunting": "Quán ăn có view mây"
  "garden_farm+cloud_hunting": "Vườn & nông trại săn mây"

# Style tags (config/styles.yaml): how each joins a noun ("Quán cà phê kiểu Hàn"); without a noun "Không gian ...".
style_noun: "Không gian"
style_with:
  retro: "hoài cổ"
  retro_saigon: "kiểu Sài Gòn xưa"
  vintage_junk: "đồ cũ, ve chai"
  french_colonial: "kiểu Pháp cổ"
  indochine: "kiểu Đông Dương"
  minimal: "tối giản"
  industrial: "kiểu công nghiệp"
  rustic: "mộc mạc"
  korean: "kiểu Hàn"
  japanese: "kiểu Nhật"
  boho: "phong cách boho"
  greenhouse: "nhà kính"

# The scenes a tag card's cover must show (config/scenes.yaml names); a tag not listed takes the place's
# first photo. Without this a restaurant holding "Thiên nhiên" put a plate of food on that card (owner 2026-10-30).
cover_scenes:
  experience:cloud_hunting: [view]
  experience:sunset_view: [view]
  experience:scenic_view: [view]
  experience:nature: [view, exterior]
  experience:flower_garden: [view, exterior]
  experience:heritage_architecture: [exterior, view]
  experience:photo_spot: [view, exterior, interior]
  experience:cozy_decor: [interior]
  experience:long_stay_chill: [interior, exterior]
  category:cafe: [interior, exterior, drink]
  category:restaurant: [food, interior]
  category:dessert: [food, drink, interior]
  category:bar: [interior, drink]
  category:nature: [view, exterior]
  category:attraction: [view, exterior]
  category:garden_farm: [view, exterior]
  category:camping: [view, exterior]
  category:religious: [exterior, view]
  category:museum: [exterior, interior]
  category:market: [exterior, interior, food]
  "dish:*": [food]   # every dish tag (a tag of its own listed above wins)

# Dish kinds: a place is in one when a dish on its menu, a review order or its own name holds one of the phrases
