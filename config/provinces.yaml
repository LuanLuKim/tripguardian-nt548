# Places a brand prices apart from the rest of their old province: a point inside `box` ([lat_min, lng_min, lat_max,
# lng_max]) belongs to the sub-area first. A brand with no row for the sub-area falls back to its row for `parent`.
subareas:
  phu_quoc: {name: Phú Quốc, parent: kien_giang, box: [9.80, 103.80, 10.48, 104.12], names: [Phú Quốc]}
  sa_pa: {name: Sa Pa, parent: lao_cai, box: [22.24, 103.74, 22.42, 103.93], names: [Sa Pa, Sapa]}
  hoi_an: {name: Hội An, parent: quang_nam, box: [15.83, 108.26, 15.94, 108.42], names: [Hội An]}

# A pickup point this close to a polygon (km) still belongs to it: the simplified coastline misses beach-front hotels.
snap_km: 15

# Airports a tariff names (airport fees, airport routes): a leg that starts or ends within `airport_km` of one is an
# airport leg, priced in the airport's `area` (Nội Bài sits on the Hà Nội – Vĩnh Phúc line of the simplified outline).
# Names are every way a brand page writes them.
airport_km: 3
airports:
