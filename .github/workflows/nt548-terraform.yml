name: nt548-terraform

# Static checks of ops/nt548/terraform on every PR that touches it: fmt, then init (no backend) + validate + test
# of each module and env. No AWS credentials: tests use mock providers, nothing is planned against a real account.

on:
  pull_request:
    paths: ["ops/nt548/terraform/**", ".github/workflows/nt548-terraform.yml"]
  push:
    branches: [main]
    paths: ["ops/nt548/terraform/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/nt548/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"   # mock_provider in terraform test needs >= 1.7
      - run: terraform fmt -check -recursive -diff
      - name: validate and test every root (a directory with .tf files, not a tests/ folder)
        run: |
          set -e
          for d in $(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$d" validate -no-color
            if ls "$d"/tests/*.tftest.hcl >/dev/null 2>&1; then terraform -chdir="$d" test -no-color; fi
            echo "::endgroup::"
          done
