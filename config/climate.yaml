# Monthly rain probability for a date beyond Open-Meteo's forecast horizon (docs/PLANNING.md §Live Context).
# Three layers, first that has the month wins:
#   1. rain_prob_override_by_month: a hand correction of the view (empty = trust the view);
#   2. the city's ClimateNormal view, data/<city>/views/climate.json (python -m corpus views climate);
#   3. rain_prob_by_month: Đà Lạt's rough hand estimate, used only while no view is built. Not a measurement.
rain_prob_override_by_month: {}
rain_prob_by_month:
  1: 0.15
  2: 0.15
  3: 0.20
  4: 0.35
  5: 0.55
  6: 0.65
  7: 0.70
  8: 0.70
  9: 0.65
  10: 0.55
  11: 0.35
  12: 0.20
