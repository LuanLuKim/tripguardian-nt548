# NT548 load balancer in front of two colors (docs/nt548/02-bluegreen-lb.md). ops/nt548/deploy.sh writes the two
# included files and reloads nginx; a reload keeps open connections, so switching colors drops no request.
worker_processes auto;
events { worker_connections 2048; }

http {
    # Sticky by user: the planning session lives in the harness RAM, so one user stays on one color (and one replica).
    # A visitor with no tg_session cookie yet is split per request.
    map $cookie_tg_session $split_key {
        ""      $request_id;
        default $cookie_tg_session;
    }

    include /etc/nginx/nt548/split.conf;      # split_clients "$split_key" $color { <n>% <new>; * <active>; }
    include /etc/nginx/nt548/upstreams.conf;  # upstream blue { ... }  upstream green { ... }

    # One JSON line per request: canary_watch.py (#3) and the fault-injection runs (#39) read it.
    log_format nt548 escape=json '{"t":"$time_iso8601","msec":$msec,"color":"$color","status":$status,'
                                 '"ms":$request_time,"up":"$upstream_addr","up_status":"$upstream_status",'
                                 '"method":"$request_method","path":"$uri"}';
    access_log /var/log/nt548/access.log nt548;
    access_log /dev/stdout nt548;

    server {
        listen 8080;

        location = /nt548-lb/health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://$color;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502;
            add_header X-LB-Color $color always;
        }
    }
}
