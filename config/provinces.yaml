# Vietnam's provinces for pricing rides (journey.areas, journey.tariffs; docs/BOOKING.md §Gọi xe).
# Brands still price by the 63 provinces before the 01/07/2025 merger, often naming the new province and the old area
# side by side ("Lâm Đồng | Đắk Nông"), so an area is an OLD province; `new` is the province it belongs to since 2025.
# Boundaries: config/provinces.geojson (geoBoundaries VNM ADM1, public domain, one feature per key below).
# `names`: every spelling a brand page uses for that old province (accents and case are folded when matching).
version: 1
areas:
  ha_noi: {name: Hà Nội, new: Hà Nội, names: [Hà Nội, Ha Noi, Hanoi]}
  ho_chi_minh: {name: TP. Hồ Chí Minh, new: TP. Hồ Chí Minh, names: [TP. Hồ Chí Minh, Hồ Chí Minh, TP.HCM, TPHCM, HCM, Ho Chi Minh, Sài Gòn, "Hồ Chí Minh cũ", "TP HCM cũ"]}
