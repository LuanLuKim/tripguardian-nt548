            start_hour: "13:00", end_hour: "14:00", pace: slow, budget_vnd: 3000000, wants: [spa nghỉ dưỡng, bữa tối lãng mạn, chụp ảnh cưới], notes: "ô tô có tài xế riêng"}
    chat:
      - {text: "Vợ chồng mình đi trăng mật Đà Lạt 3 ngày từ 5/12, có xe ô tô riêng kèm tài xế, tối đa thoải mái, ngân sách cao cấp khoảng 3 triệu một người một ngày. Mình muốn spa nghỉ dưỡng và bữa tối lãng mạn, ngày đầu 1 giờ chiều mới bắt đầu.", kind: opening}
    sim_replies: 2
    pick: {mode: medium, n: 6, groups: [spa, meal, cafe, nature]}
    edits:
      - {op: add_backup, verify: present}
