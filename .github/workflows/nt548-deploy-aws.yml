name: nt548-deploy-aws

# #29: blue/green release on the AWS lab through Terraform (ops/nt548/deploy_aws.sh, docs/nt548/01-ci-cd.md).
# - After nt548-images built :<sha> on main: idle color gets it -> healthy -> 10 % canary -> watch -> promote / roll back.
# - Manual: action=deploy (any sha already on GHCR), rollback (< 1 min, only the weight changes), status.
# Runner: the self-hosted one in the lab (labels self-hosted, nt548-aws; credentials from LabInstanceProfile).
# Fallback when it is broken: runner=github uses lab credentials from the nt548-aws environment (admin only).
# Nothing runs until the repository variable NT548_DEPLOY_ENABLED is "true" (set it once the runner and envs/demo
# exist), so merges before that do not queue jobs for a runner that is not there.
# Safety: no pull_request trigger, so code from a PR never runs on the self-hosted runner.
# The automatic run (workflow_run) never builds envs/demo from an empty state: it only releases onto an environment
# that is up (FIRST_DEPLOY=0). A manual deploy may, like aws.sh up (incident 28/11, docs/nt548/08-aws-infra.md).

on:
  workflow_run:
    workflows: [nt548-images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, rollback, status]
        default: status
      sha:
        description: image tag to deploy (default the commit this runs on)
        required: false
      runner:
        description: self-hosted (normal) or github (fallback with credentials from the nt548-aws environment)
        type: choice
        options: [self-hosted, github]
        default: self-hosted

permissions:
  contents: read

concurrency:
  group: nt548-deploy-aws   # two releases never overlap; a queued one waits
  cancel-in-progress: false

env:
  ACTION: ${{ inputs.action || 'deploy' }}
  SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: "1"
  NAME_PREFIX: ${{ vars.NT548_NAME_PREFIX || 'nt548' }}
  FIRST_DEPLOY: ${{ github.event_name == 'workflow_run' && '0' || '1' }}

jobs:
  self-hosted:
    if: >-
      vars.NT548_DEPLOY_ENABLED == 'true' && (inputs.runner || 'self-hosted') == 'self-hosted' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, nt548-aws]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: bash ops/nt548/aws.sh init   # the state is in the bootstrap's bucket (#22)
      - run: bash ops/nt548/deploy_aws.sh "$ACTION" "$SHA"

  github:
    if: vars.NT548_DEPLOY_ENABLED == 'true' && inputs.runner == 'github'
    runs-on: ubuntu-latest
    environment: nt548-aws
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # deploy_aws.sh parses `terraform output -json`
      - run: pip install boto3 pyyaml   # canary_watch.py reads CloudWatch
      - run: bash ops/nt548/aws.sh init
      - run: bash ops/nt548/deploy_aws.sh "$ACTION" "$SHA"
