name: nt548-images

# Every merge to main: harness, web and llm-fake images tagged :<full sha> (immutable, for deploy and rollback)
# and :main (latest). Public on GHCR, so the app machines pull without a login (design §5.1).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nt548-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: harness, context: ., file: ops/nt548/compose/harness.Dockerfile}
          - {image: web, context: ., file: ops/nt548/compose/web.Dockerfile}
          - {image: llm-fake, context: ops/nt548/llm_fake, file: ops/nt548/llm_fake/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/luanlukim/tripguardian-nt548/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/luanlukim/tripguardian-nt548/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
