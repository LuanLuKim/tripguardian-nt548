        - "Có ít nhất một spa hoặc nơi nghỉ dưỡng và một bữa tối đáng nhớ"
        - "Quán ăn và nơi chơi phù hợp mức chi cao cấp, không toàn chỗ bình dân"
        - "Ngày đầu bắt đầu khoảng 13h"
        - "Mỗi ngày không quá 4 nơi"

  - id: couple_weekend_streetfood_crowd
