<title>Khám phá 3D</title>
<!--
Place schema: coordinates are [x,y,z] in metres, with +z facing the entrance.
site: {width,depth,centerZ?:0,outline?:[[worldX,worldZ],...],hill?:{profile:[[z,height],...],undulation}};
Optional outline defines a flat polygonal plinth and replaces rectangular framing corners.
hill profile runs from the street (+z) to the rear (-z), with smooth interpolation.
objects: array of typed primitives with optional stable id.
Positions are bases except terrace.position, which is the box centre.
terrace: position,size,color; slope: corners [[x,y,z],...],color;
retaining_wall: points [[x,y,z],...],height;
road: points,width,curved (draped on hill),graded (grade points cut/fill terrain),
approach (straight axis),groups,stepsPerGroup,stepRise,tread;
planting: position,size,draped,outline (optional world [x,z] perimeter);
stairs: position,width,steps,rise,run,flights (step counts),landing (between each flight);
building: position,size,color,roof,role (main selects an open colonnade);
gate: position,width,height,wood,sign (optional);
roof: legacy string or {overhang,curve,cornerLift,thickness,tiers,tierGap,ridgeOrnament,
eaveHeight,ridgeHeight,color,tileSpacing,tileBand}; heights are relative to the object's base.
All architectural roofs use vietnameseRoof; the ridge follows the longer side.
pavilion: position,size,storeys,statue; tower: position,height,grounded;
statue: position,kind; tree: position,kind,height,grounded; rock/lamp/bench: position.
grounded samples the rendered hill rather than retaining a fixed base elevation.
hotspots: id,title,caption,anchor,camera,target,subjects (object ids),
bounds (fallback w,h,d centred on target),photos (local evidence basenames),walk ([x,z]).
hotspot.fill defaults to .58; cutaway selects an object id; interior + building select an interior kit.
building.interior.kit names a registered kit; building.cutaway.lift defaults to 7.4.
route: walking polylines of [x,z] linking consecutive outdoor stops, draped on walkable geometry.
path_steps: position (base centre),width (z),length (x),steps,rise,direction (outward x sign).
camera defines the viewing direction; subject vertices determine fly-in distance.
-->

<script type="module">
// Avoid a burst of direct module requests on resource-constrained render clients.
const THREE = await import("three");
const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
const { RoomEnvironment } = await import("three/addons/environments/RoomEnvironment.js");
const { EffectComposer } = await import("three/addons/postprocessing/EffectComposer.js");
const { RenderPass } = await import("three/addons/postprocessing/RenderPass.js");
const { GTAOPass } = await import("three/addons/postprocessing/GTAOPass.js");

const { mergeGeometries } = await import("three/addons/utils/BufferGeometryUtils.js");
// === Config / palette ===
const place = __PLACE__;
const config = {
  defaultAzimuth: 35,
  defaultPolar: 73,
  frameFill: .80,
  edgeThreshold: 27,
  useGTAO: true

config.frameFill = place.site.frameFill ?? config.frameFill;
config.defaultPolar = place.site.overviewPolar ?? config.defaultPolar;
config.defaultAzimuth = place.site.overviewAzimuth ?? config.defaultAzimuth;
// Warm, photo-like palette (owner 2026-11-04: vivid, true to photos, not grey or cold).
const palette = {
  stone: "#efe5d3",
  stair: "#dccdb4",
  roof: "#a8492d",
  roofEdge: "#7c3420",
  wood: "#875a3a",
  ochre: "#ebc574",
  green: "#b7d39b",
  bed: "#94c27a",
  pine: "#5f9a57",
  trunk: "#8a6a4e",
  white: "#f8f2e6",
  blue: "#9ec4c6",
  dark: "#6c5a49",
  gold: "#d6a94e",
  line: "#978d7f"
};
const $ = (id) => document.getElementById(id);
$("place-name").textContent = place.name;
document.title = place.name + " · Khám phá 3D";
$("place-location").textContent = place.location || "";
const scene = new THREE.Scene();
let overviewFovEffective=place.site.overviewFov??36;
function overviewFov(aspect=innerWidth/innerHeight) {
  return Math.max(overviewFovEffective,aspect<1?36:0);
}
const camera = new THREE.PerspectiveCamera(overviewFov(), innerWidth / innerHeight, place.site.overviewNear??.1, 800);
const overview = {
  position: new THREE.Vector3(112, 106, 132),
  target: new THREE.Vector3(0, 6, place.site.centerZ || 0)
};
let freeArea;
function frameView(focused = false) {
  const left = 40, right = 40, top = focused ? 150 : 100, bottom = 140;
  freeArea = {
    left,
    top,
    width: innerWidth - left - right,
    height: innerHeight - top - bottom

  camera.setViewOffset(innerWidth, innerHeight, -(left - right) / 2, -(top - bottom) / 2, innerWidth, innerHeight);
}
// Fit the actual projected site envelope, not a sphere or a fixed orbit distance.
function fitOverview(azimuth, polar) {
  camera.fov=overviewFov(camera.aspect);
  camera.updateProjectionMatrix();
  frameView(false);
  const direction = new THREE.Vector3().setFromSpherical(new THREE.Spherical(1, THREE.MathUtils.degToRad(polar), THREE.MathUtils.degToRad(azimuth)));
  const points = [];
  for (const x of [-place.site.width / 2, place.site.width / 2]) {
    for (const z of [-place.site.depth / 2, place.site.depth / 2]) points.push(new THREE.Vector3(x, -3, z + (place.site.centerZ || 0)));
  }
  if(place.site.outline)points.splice(0,points.length,...place.site.outline.map(([x,z])=>new THREE.Vector3(x,-3,z)));
  if(place.site.overviewSubjects&&(place.site.overviewAllAngles||azimuth===config.defaultAzimuth&&polar===config.defaultPolar)&&typeof modelEnvelopes!=='undefined') {
    const subjects=place.site.overviewSubjects.flatMap(id=>modelEnvelopes.get(id)||[]);
    if(subjects.length){points.length=0;for(const point of subjects)points.push(point);}
  }
  // The plinth is the measured envelope. Object y values have mixed centre/base
  // semantics and must not be inflated into imaginary y+h+5 bounding boxes.
  const heightFill=Math.min(place.site.overviewHeightFill??.88,(innerHeight-88)/freeArea.height);
  function searchDistance() {
    let low = 10, high = 600;
    for (let i = 0; i < 25; i++) {
      const distance = (low + high) / 2;
      camera.position.copy(overview.target).addScaledVector(direction, distance);
      camera.lookAt(overview.target);
      camera.updateMatrixWorld();
      const bounds=projectedBounds(points);
      const width = (bounds.maxX-bounds.minX) * innerWidth / 2;
      const height = (bounds.maxY-bounds.minY) * innerHeight / 2;
      if (Math.max(width / (freeArea.width * config.frameFill), height / (freeArea.height * heightFill)) > 1) low = distance;
      else high = distance;
    }
    return high;
  }
  let high=searchDistance();
  if(high===600&&camera.fov<36) {
    camera.position.copy(overview.target).addScaledVector(direction, high);
    camera.updateMatrixWorld();
    const bounds=projectedBounds(points);
    const ratio=Math.max(bounds.widthFraction/config.frameFill,bounds.heightFraction/heightFill);
    if(ratio>1) {
      overviewFovEffective=Math.min(36,THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)*ratio*1.02)));
      camera.fov=overviewFov(camera.aspect);
      camera.updateProjectionMatrix();
      high=searchDistance();
    }
  }
  overview.position.copy(overview.target).addScaledVector(direction, high);
  camera.position.copy(overview.position);
  camera.updateMatrixWorld();
  const bounds=projectedBounds(points),centerX=bounds.centerX,centerY=bounds.centerY;
  camera.setViewOffset(innerWidth, innerHeight, camera.view.offsetX + centerX - (freeArea.left + freeArea.width / 2), camera.view.offsetY + centerY - (freeArea.top + freeArea.height / 2), innerWidth, innerHeight);
  console.info("overview-bbox", JSON.stringify({azimuth, polar, distance:high, fov:camera.fov,
    widthFraction:bounds.widthFraction,
    heightFraction:bounds.heightFraction,
    binding:`plinth: width ${config.frameFill} / height ${heightFill}`}));
}
function projectedBounds(points) {
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  const p=new THREE.Vector3();
  for(const point of points) {
    p.copy(point).project(camera);
    minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);
  }
  return {minX,maxX,minY,maxY,widthFraction:(maxX-minX)*innerWidth/2/freeArea.width,
    heightFraction:(maxY-minY)*innerHeight/2/freeArea.height,
    centerX:(maxX+minX)*innerWidth/4+innerWidth/2,
    centerY:innerHeight/2-(maxY+minY)*innerHeight/4};
}
function fitSpot(spot) {
  if(spot.interior)return {position:new THREE.Vector3(...spot.camera),target:new THREE.Vector3(...spot.target)};
  const savedPosition=camera.position.clone(), savedQuaternion=camera.quaternion.clone();
  const target=new THREE.Vector3(...spot.target);
  const direction=new THREE.Vector3(...spot.camera).sub(target).normalize();
  const bounds=spot.bounds;
  const points=spot.subjects && typeof modelEnvelopes!=="undefined"
    ? spot.subjects.flatMap(id=>modelEnvelopes.get(id)||[]) : [];
  if(spot.cutaway && !spot.insideView && typeof roofRecords!=='undefined') {
    const object=place.objects.find(o=>o.id===spot.cutaway);
    for(const record of roofRecords.filter(r=>r.objectId===spot.cutaway)) {
      const lifted=new THREE.Box3().setFromObject(record.group);
      lifted.translate(new THREE.Vector3(0,(record.baseY||0)+(object?.cutaway?.lift??7.4)-record.group.position.y,0));
      for(const dx of [lifted.min.x,lifted.max.x])for(const dy of [lifted.min.y,lifted.max.y])for(const dz of [lifted.min.z,lifted.max.z])points.push(new THREE.Vector3(dx,dy,dz));
    }
  }
  if(!points.length) for(const dx of [-1,1]) for(const dy of [-1,1]) for(const dz of [-1,1])
    points.push(target.clone().add(new THREE.Vector3(dx*bounds[0]/2,dy*bounds[1]/2,dz*bounds[2]/2)));
  if(typeof routeSegments!=='undefined' && spot.walk && spot.frameRoute!==false) {
    const index=place.hotspots.filter(s=>s.walk).findIndex(s=>s.id===spot.id),leg=routeSegments[index];
    points.push(new THREE.Vector3(spot.walk[0],routeHeight(...spot.walk)+.7,spot.walk[1]));
    if(leg)for(const sample of leg.samples)if(sample.d<=8)points.push(sample.point);
  }
  let low=3,high=300, widthFraction=0,heightFraction=0;
  for(let i=0;i<25;i++) {
    const distance=(low+high)/2;
    camera.position.copy(target).addScaledVector(direction,distance);
    camera.lookAt(target);camera.updateMatrixWorld();
    ({widthFraction,heightFraction}=projectedBounds(points));
    if(Math.max(widthFraction,heightFraction)>(spot.fill??.58)) low=distance; else high=distance;
  }
  const position=target.clone().addScaledVector(direction,high);
  camera.position.copy(position);camera.lookAt(target);camera.updateMatrixWorld();
  const {centerX:cx,centerY:cy}=projectedBounds(points);
  camera.setViewOffset(innerWidth,innerHeight,camera.view.offsetX+cx-(freeArea.left+freeArea.width/2),camera.view.offsetY+cy-(freeArea.top+freeArea.height/2),innerWidth,innerHeight);
  camera.position.copy(savedPosition);camera.quaternion.copy(savedQuaternion);camera.updateMatrixWorld();
  console.info("hotspot-bbox",JSON.stringify({id:spot.id,widthFraction,heightFraction,distance:high}));
  return {position,target};
}
frameView();
camera.position.copy(overview.position);
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .96;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
$("canvas").appendChild(renderer.domElement);
const environmentGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = environmentGenerator.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .18;
environmentGenerator.dispose();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(overview.target);
controls.enableDamping = true;
controls.zoomToCursor = true;
controls.dampingFactor = .08;
controls.maxPolarAngle = Math.PI / 2.08;
controls.minDistance = 3;
controls.maxDistance = 600;
controls.autoRotate = true;
controls.autoRotateSpeed = .3;
// Warm sun with a slightly blue sky fill: the colour contrast between lit and shaded faces reads as daylight.
scene.add(new THREE.HemisphereLight("#fdf7ec", "#d2c7ae", 1.3));
const fill = new THREE.DirectionalLight("#dfe9f6", .55);
fill.position.set(80, 65, -65);
scene.add(fill);
const sun = new THREE.DirectionalLight("#ffeccf", 1.9);
sun.position.set(-65, 120, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {
  left: -85,
  right: 85,
  top: 75,
  bottom: -75,
  near: 20,
  far: 250
});
sun.shadow.bias = -15e-5;
sun.shadow.normalBias = .06;
sun.shadow.radius = 7;
sun.shadow.blurSamples = 8;
scene.add(sun);
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;
// === Materials ===
const mats = new Map();
const grainCanvas = typeof document !== "undefined" ? document.createElement("canvas") : null;
let grain = null;
if (grainCanvas) {
grainCanvas.width = grainCanvas.height = 128;
const grainContext = grainCanvas.getContext("2d"), grainImage = grainContext.createImageData(128, 128);
for (let i = 0; i < 128 * 128; i++) {
  const v = 247 + Math.round(3 * Math.sin(i * 12.9898) * Math.sin(i * .071));
  grainImage.data.set([v, v, v, 255], i * 4);
}
grainContext.putImageData(grainImage, 0, 0);
grain = new THREE.CanvasTexture(grainCanvas);
grain.colorSpace = THREE.SRGBColorSpace;
}
function material(color) {
  // Legacy declarative colours remain stable; their finish follows the studio palette.
  color = ({'#e9e4da':palette.stone,'#d9d2c4':palette.stair,'#cfae6a':palette.ochre,
    '#cbb783':'#ddcea9','#62372e':palette.roof,'#725144':'#a07861',
    '#849b79':palette.green,'#a7b48f':palette.bed,'#a8aaa1':'#e2dccf',
    '#a56f56':'#cfb9a2','#30221d':palette.wood,'#4a2a20':palette.wood,
    '#b7aa8e':'#d4cdbc','#a49b88':'#c7c1b5','#6b7c58':'#a3b096',
    '#607c87':'#afbcb9','#455d66':'#aeb8b5','#516c77':'#b4bfbc','#405963':'#98a4a2',
    '#d1b772':'#d8c9a4','#a58a4c':'#c3b18e','#263d58':'#57616d',
    '#793e35':'#90665b','#854b3c':'#997468','#45382d':'#7b6857',
    '#a69e90':'#c9c1b4','#c5bcaa':'#d7cfc0','#b8ad96':'#d0c7b7',
    '#805442':'#9a7962','#a27659':'#b3977c'})[color] || color;
  if (!mats.has(color)) mats.set(color, new THREE.MeshStandardMaterial({
    color,
    map: [palette.stone, palette.stair, palette.ochre, palette.green, palette.bed].includes(color) ? grain : null,
    roughness: color === palette.blue ? .78 : .94,
    metalness: 0,
    emissive: color==="#30221d" ? color : "#000000",

function setForegroundVisibility(position=null,target=null,corridor=null) {

function moveTo(position, target, instant = false, viewTo = null, fromInterior = false, stops = null) {

function updateTour() {

let down = null;

  down = [event.clientX, event.clientY];

  const pointer = new THREE.Vector2(event.clientX / innerWidth * 2 - 1, -event.clientY / innerHeight * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickableMeshes, false);

// Display-space grade shared by every kit (owner 2026-11-04: vivid, true to photos, not grey or cold):

  uniforms: { tDiffuse: { value: null }, saturation: { value: 1.32 }, vibrance: { value: .55 }, leaf: { value: .5 }, warmth: { value: .012 }, contrast: { value: 1.07 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }",

window.addEventListener("resize", () => {

function updatePins() {

// Per-place recolour from photos (owner 2026-11-04): place.colorMap {"#old": "#photo"} swaps a built colour wherever it

(function applyColorMap(map) {
